# Buduje GeigerApp.exe na Windowsie przy kazdej zmianie.
# - main: nowe wydanie w zakladce Releases; stały link do pobrania:
#   https://github.com/MateuszKowalczyk101/Elektronika/releases/latest/download/GeigerApp.exe
# - inne gałęzie: .exe do pobrania jako artefakt przebiegu (do sprawdzenia przed scaleniem)
name: Buduj GeigerApp.exe

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Testy
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Budowanie .exe (build_exe.bat)
        shell: cmd
        run: build_exe.bat

      - name: Sprawdzenie, czy GeigerApp.exe startuje i ma paczke nidaqmx
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "smoke.txt"
          $env:GEIGERAPP_SMOKE_TEST = $out
          $p = Start-Process -FilePath "dist\GeigerApp.exe" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "GeigerApp.exe nie zamknal sie w 180 s (blad przy starcie?)" }
          if (-not (Test-Path $out)) { throw "GeigerApp.exe nie zapisal wyniku testu startu" }
          $res = Get-Content $out
          Write-Host "Wynik testu startu: $res"
          if ($res -notmatch "nidaqmx=1") { throw "W GeigerApp.exe nie dziala paczka nidaqmx" }
          if ($res -match "ModuleNotFoundError|ImportError|PackageNotFoundError") { throw "W GeigerApp.exe brakuje czesci paczek" }

      - name: GeigerApp.exe do pobrania (gałąź robocza)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: GeigerApp
          path: dist/GeigerApp.exe

      - name: Wydanie w Releases (main)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          notes="GeigerApp.exe zbudowany automatycznie z commita ${GITHUB_SHA:0:7}.
          Pobierz plik GeigerApp.exe ponizej. Do pracy z karta NI potrzebny jest sterownik NI-DAQmx (instrukcja w README)."
          gh release create "$tag" "dist/GeigerApp.exe" --target "$GITHUB_SHA" \
            --title "GeigerApp ($tag)" --notes "$notes" --latest
